
services:

  traefik:
    image: docker.io/traefik:v3.6.5
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44" 
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
    ports:
      - "8081:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./logs/traefik:/var/log/traefik
    networks:
      - financial_manager

  session-auth:
    build: 
      context: ./session
      dockerfile: docker/session/Dockerfile
      target: dev
    env_file: ./session/config/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.session-auth.entrypoints=web"
      - "traefik.http.routers.session-auth.rule=Host(`session-auth.localhost`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.session-auth.service=session-auth-service"
      #register
      - "traefik.enable=true"
      - "traefik.http.routers.session-auth-register.entrypoints=web"
      - "traefik.http.routers.session-auth-register.rule=Host(`session-auth.localhost`) && PathPrefix(`/register`)"
      # Router to /static
      - "traefik.http.routers.session-auth-static.rule=Host(`session-auth.localhost`) && PathPrefix(`/static`)"
      - "traefik.http.routers.session-auth-static.entrypoints=web"
      # Router to /media
      - "traefik.http.routers.session-auth-media.rule=Host(`session-auth.localhost`) && PathPrefix(`/media`)"
      - "traefik.http.routers.session-auth-media.entrypoints=web"
      # Activate
      - "traefik.http.routers.session-auth-activate.rule=Host(`session-auth.localhost`) && PathPrefix(`/activate`)"
      - "traefik.http.routers.session-auth-activate.service=session-auth-service"
      # ReCAPTCHE
      - "traefik.http.routers.session-auth-recaptche.entrypoints=web"
      - "traefik.http.routers.session-auth-recaptche.rule=Host(`session-auth.localhost`) && PathPrefix(`/.well-known`)"
      - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://www.google.com; connect-src 'self' https://www.google.com https://www.gstatic.com; img-src 'self' data:"
      - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.routers.session-auth.middlewares=secure-headers@docker"
      - "traefik.http.services.session-auth-service.loadbalancer.server.port=8000"
    expose:
      - 8000
    user: "${UID}:${GID}" 
    volumes:
      - ./session:/session_auth
      - ./logs/auth:/session_auth/logs
    depends_on:
      - session-db
      - mailpit
      - redis
      - rabbitmq
    command: ["bash", "docker/session/start.sh"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - financial_manager

  session-db:
    build:
      context: ./session
      dockerfile: docker/postgres/Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - session_service_db:/var/lib/postgresql/data
    env_file:
      - ./session/config/.env
    networks:
      - financial_manager

  nice-ui:
    build:
      context: ./ui
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
      target: dev
    volumes:
      - ./ui:/app
      - ./logs/ui:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`wallet.localhost`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui.service=ui-service"
      - "traefik.http.routers.ui.middlewares=ui-forwardauth@docker,nocache@docker"
      - "traefik.http.middlewares.ui-forwardauth.forwardauth.address=http://session-auth:8000/verifySession/"
      - "traefik.http.middlewares.ui-forwardauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.ui-forwardauth.forwardauth.authResponseHeaders=X-User"
      - "traefik.http.middlewares.ui-forwardauth.forwardauth.addAuthCookiesToResponse=hmac,sessionid"
      # Router to /static
      - "traefik.http.routers.ui-static.rule=Host(`wallet.localhost`) && (PathPrefix(`/_nicegui/`) || PathPrefix(`/_nicegui_ws/`))"
      - "traefik.http.routers.ui-static.entrypoints=web"
      # Router to /login
      - "traefik.http.routers.ui-login.rule=Host(`wallet.localhost`) && (PathPrefix(`/login`) || PathPrefix(`/login/`))"
      - "traefik.http.routers.ui-login.entrypoints=web"
      - "traefik.http.routers.ui-login-fin.rule=Host(`wallet.localhost`) && (PathPrefix(`/finalize-login`) || PathPrefix(`/finalize-login/`))"
      - "traefik.http.routers.ui-login-fin.entrypoints=web"
      # Router to /register
      - "traefik.http.routers.ui-register.rule=Host(`wallet.localhost`) && (PathPrefix(`/register`) || PathPrefix(`/register/`))"
      - "traefik.http.routers.ui-register.entrypoints=web"
      # Router to /home
      - "traefik.http.routers.ui-home.rule=Host(`wallet.localhost`) && (PathPrefix(`/home`) || PathPrefix(`/home/`))"
      - "traefik.http.routers.ui-home.entrypoints=web"
      # Router to /error
      - "traefik.http.routers.ui-error.rule=Host(`wallet.localhost`) && (PathPrefix(`/error`) || PathPrefix(`/error/`))"
      - "traefik.http.routers.ui-error.entrypoints=web"
      # Router to  /.well-known
      - "traefik.http.routers.ui-recaptche.rule=Host(`wallet.localhost`) && (PathPrefix(`/.well-known`) || PathPrefix(`/.well-known/`))"
      - "traefik.http.routers.ui-recaptche.entrypoints=web"
      #png
      - "traefik.http.routers.ui-png.rule=Host(`wallet.localhost`) && PathPrefix(`/favicon.png`)"
      - "traefik.http.routers.ui-png.entrypoints=web"
      - "traefik.http.middlewares.nocache.headers.customResponseHeaders.Cache-Control=no-store"
      - "traefik.http.services.ui-service.loadbalancer.server.port=8501"
    env_file:
      - ./ui/.env
    depends_on:
      - redis
    expose:
      - 8501
    networks:
      - financial_manager

  next-ui:
    build:
      context: ./next-ui
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ./next-ui:/app
      - next_ui_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.next-ui.rule=Host(`next.localhost`)"
      - "traefik.http.routers.next-ui.entrypoints=web"
      - "traefik.http.routers.next-ui.service=next-ui-service"
      - "traefik.http.routers.next-ui.middlewares=next-forwardauth@docker,next-auth-errors@docker,nocache@docker"
      - "traefik.http.middlewares.next-forwardauth.forwardauth.address=http://session-auth:8000/verifySession/"
      - "traefik.http.middlewares.next-forwardauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.next-forwardauth.forwardauth.authResponseHeaders=X-User,X-First-Name,X-Email,X-User-Id"
      - "traefik.http.middlewares.next-forwardauth.forwardauth.addAuthCookiesToResponse=hmac,sessionid"
      - "traefik.http.middlewares.next-auth-errors.errors.status=401-403"
      - "traefik.http.middlewares.next-auth-errors.errors.service=next-ui-service"
      - "traefik.http.middlewares.next-auth-errors.errors.query=/login"
      - "traefik.http.routers.next-ui-static.rule=Host(`next.localhost`) && PathPrefix(`/_next/`)"
      - "traefik.http.routers.next-ui-static.entrypoints=web"
      - "traefik.http.routers.next-ui-static.service=next-ui-service"
      - "traefik.http.routers.next-ui-favicon.rule=Host(`next.localhost`) && Path(`/favicon.ico`)"
      - "traefik.http.routers.next-ui-favicon.entrypoints=web"
      - "traefik.http.routers.next-ui-favicon.service=next-ui-service"
      - "traefik.http.routers.next-ui-devtools-wellknown.rule=Host(`next.localhost`) && PathPrefix(`/.well-known/appspecific/`)"
      - "traefik.http.routers.next-ui-devtools-wellknown.entrypoints=web"
      - "traefik.http.routers.next-ui-devtools-wellknown.service=next-ui-service"
      - "traefik.http.routers.next-ui-devtools-sourcemap.rule=Host(`next.localhost`) && PathPrefix(`/__nextjs_source-map`)"
      - "traefik.http.routers.next-ui-devtools-sourcemap.entrypoints=web"
      - "traefik.http.routers.next-ui-devtools-sourcemap.service=next-ui-service"
      - "traefik.http.routers.next-ui-login.rule=Host(`next.localhost`) && (PathPrefix(`/login`) || PathPrefix(`/register`) || PathPrefix(`/logout`))"
      - "traefik.http.routers.next-ui-login.entrypoints=web"
      - "traefik.http.routers.next-ui-login.service=next-ui-service"
      - "traefik.http.services.next-ui-service.loadbalancer.server.port=3000"
      - "traefik.http.routers.next-ui-home.rule=Host(`next.localhost`) && (PathPrefix(`/home`) || PathPrefix(`/home/`))"
      - "traefik.http.routers.next-ui-home.entrypoints=web"
      - "traefik.http.routers.next-ui-home.service=next-ui-service"
    env_file:
      - ./next-ui/.env
    depends_on:
      - session-auth
    expose:
      - 3000
    networks:
      - financial_manager

  wallet:
    build:
      context: ./wallet
      dockerfile: docker/fastapi/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
      target: dev
    volumes:
      - ./wallet:/wallet_api
      - ./logs/wallet:/wallet_api/logs
    expose:
      - 8001
    env_file:
      - ./wallet/app/core/.envs/.env.local
    depends_on:
      - wallet-db
    command: ["bash", "docker/fastapi/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8001/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - financial_manager

  stock:
    build:
      context: ./stock
      dockerfile: docker/fastapi/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
      target: dev
    volumes:
      - ./stock:/stock_api
      - ./logs/stock:/stock_api/logs
    expose:
      - 8001
    env_file:
      - ./stock/app/core/.envs/.env.local
    depends_on:
      - stock-db
    command: ["bash", "docker/fastapi/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8001/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - financial_manager

  celerystockworker:
    build:
      context: ./stock
      dockerfile: docker/fastapi/Dockerfile
      target: dev
    volumes:
      - ./stock:/stock_api
      - ./logs/stock:/stock_api/logs
    env_file:
      - ./stock/app/core/.envs/.env.local
    depends_on:
      - stock-db
      - redis
      - rabbitmq
    command: ["bash", "docker/celery/worker/start.sh"]
    networks:
      - financial_manager

  stock-db:
    build:
      context: ./stock
      dockerfile: docker/postgres/Dockerfile
    ports:
      - "5434:5432"
    volumes:
      - stock_service_db:/var/lib/postgresql/data
    env_file:
      - ./stock/app/core/.envs/.env.local
    networks:
      - financial_manager

  celerystockbeat:
    build:
      context: ./stock
      dockerfile: docker/fastapi/Dockerfile
      target: dev
    volumes:
      - ./stock:/stock_api
      - ./logs/stock:/stock_api/logs
    env_file:
      - ./stock/app/core/.envs/.env.local
    depends_on:
      - stock-db
      - redis
      - rabbitmq
    command: ["bash", "docker/celery/beat/start.sh"]
    networks:
      - financial_manager

  wallet-db:
    build:
      context: ./wallet
      dockerfile: docker/postgres/Dockerfile
    ports:
      - "5433:5432"
    volumes:
      - wallet_service_db:/var/lib/postgresql/data
    env_file:
      - ./wallet/app/core/.envs/.env.local
    networks:
      - financial_manager
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf  
      - redis_data:/data                              
    command: ["redis-server", "/etc/redis/redis.conf"]
    networks:
      - financial_manager

  mailpit:
    image: docker.io/axllent/mailpit:v1.20.3
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - financial_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCPEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - financial_manager

  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - financial_rabbitmq_data:/var/lib/rabbitmq
    env_file: ./session/config/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.routers.rabbitmq.service=rabbitmq-service"
      - "traefik.http.services.rabbitmq-service.loadbalancer.server.port=15672"
    networks:
      - financial_manager

  celeryworker: &celery
    build: 
      context: ./session
      dockerfile: docker/session/Dockerfile
      target: dev
    env_file: ./session/config/.env
    volumes:
      - ./session:/session_auth
      - ./logs/auth:/session_auth/logs
    depends_on:
      - session-db
      - mailpit
      - redis
      - rabbitmq
    user: "${UID}:${GID}"
    command: ["bash", "docker/celery/worker/start.sh"]
    restart: on-failure
    networks:
      - financial_manager

  celerybeat:
    <<: *celery
    command: ["bash", "docker/celery/beat/start.sh"]

  flower:
    build: 
      context: ./session
      dockerfile: docker/session/Dockerfile
    env_file: ./session/config/.env
    depends_on:
      - redis
      - rabbitmq
    restart: on-failure
    ports:
      - "5555:5555"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.entrypoints=web"
      - "traefik.http.routers.flower.rule=Host(`flower.localhost`)"
      - "traefik.http.routers.flower.service=flower-service"
      - "traefik.http.services.flower-service.loadbalancer.server.port=5555"
    user: "${UID}:${GID}"
    command: ["bash", "docker/celery/flower/start.sh"]
    networks:
      - financial_manager

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file:
      - ./pgadmin/.env.local
    tty: true
    user: "0:0"
    entrypoint: >
      /bin/sh -c "
      set -e;
      USER_DIR=$$(echo \"$$PGADMIN_DEFAULT_EMAIL\" | sed 's/@/_/g');
      mkdir -p \"/var/lib/pgadmin/storage/$$USER_DIR\";
      chmod 700 \"/var/lib/pgadmin/storage/$$USER_DIR\";
      cp -f /pgadmin4/pgpass \"/var/lib/pgadmin/storage/$$USER_DIR/pgpass\";
      chmod 600 \"/var/lib/pgadmin/storage/$$USER_DIR/pgpass\";
      chown 5050:5050 \"/var/lib/pgadmin/storage/$$USER_DIR/pgpass\";
      exec /entrypoint.sh
      "
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    ports:
      - "5050:80"
    networks:
      - financial_manager

networks:
  financial_manager:
    external: true

volumes:
  session_service_db:
  wallet_service_db:
  stock_service_db:
  redis_data:
  financial_mailpit_data:
  financial_rabbitmq_data:
  pgadmin_data:
  next_ui_node_modules:
