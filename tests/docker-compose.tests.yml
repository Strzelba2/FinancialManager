services:
  next-ui:
    volumes:
      - next_ui_test_build:/app/.next

  session-db:
    ports: !reset []
    environment:
      POSTGRES_DB: session_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - session_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d session_test -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wallet-db:
    ports: !reset []
    environment:
      POSTGRES_DB: Wallet_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - wallet_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d Wallet_test -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  stock-db:
    ports: !reset []
    environment:
      POSTGRES_DB: stock_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - stock_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d stock_test -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  session-auth:
    environment:
      ENV_TYPE: test
      POSTGRES_HOST: session-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: session_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      DJANGO_CREATE_SUPERUSER: "0"

  wallet:
    environment:
      ENV_TYPE: test
      POSTGRES_HOST: wallet-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: Wallet_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      DATABASE_URL: ""

  stock:
    environment:
      ENV_TYPE: test
      POSTGRES_HOST: stock-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stock_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      DATABASE_URL: ""

  redis:
    container_name: "${TEST_COMPOSE_PROJECT_NAME:-financialmanager_tests}_redis"
    ports: !reset []

  mailpit:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  flower:
    ports: !reset []

  pgadmin:
    container_name: "${TEST_COMPOSE_PROJECT_NAME:-financialmanager_tests}_pgadmin"
    ports: !reset []

  test-runner:
    build:
      context: .
      dockerfile: tests/docker/test-runner.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      session-db:
        condition: service_healthy
      wallet-db:
        condition: service_healthy
      stock-db:
        condition: service_healthy
      traefik:
        condition: service_started
      session-auth:
        condition: service_healthy
      wallet:
        condition: service_healthy
      stock:
        condition: service_healthy
      nice-ui:
        condition: service_started
      next-ui:
        condition: service_started
    networks:
      - financial_manager

  allure-ui:
    image: nginx:1.27-alpine
    ports:
      - "5252:80"
    volumes:
      - ./tests/artifacts/allure-report:/usr/share/nginx/html:ro
    networks:
      - financial_manager

networks:
  financial_manager:
    name: "${TEST_COMPOSE_PROJECT_NAME:-financialmanager_tests}_network"
    external: false

volumes:
  session_test_db:
  wallet_test_db:
  stock_test_db:
  next_ui_test_build:
