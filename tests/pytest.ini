[pytest]
testpaths =
    tests/component_tests
    tests/integration_tests
python_files = test_*.py
addopts = --strict-markers
markers =
    component: component-level coverage through public HTTP surfaces
    integration: integration-level coverage for service health and readiness
    contract: API/schema contract checks
    db: database migration and persistence checks
    security: security-focused misuse and abuse checks
    fuzz: deterministic fuzz and malformed-input checks
    performance: load and latency checks for risk-sensitive paths
    load: heavier multi-user load checks that are run explicitly
    stress: concurrent stress checks for critical paths
    capacity: capacity probes that collect breakpoint evidence for the development stack
    dast: dynamic application security testing configuration and evidence checks
